services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: sqlite:////data/venotrack.db
      JWT_SECRET: ${JWT_SECRET:-local-demo-secret-change-before-deploying}
    volumes:
      - venotrack-data:/data
  web:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        VITE_API_URL: http://localhost:8000/api/v1
    ports:
      - "5173:80"
    depends_on:
      - api
volumes:
  venotrack-data:
